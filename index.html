<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avventura con Spirit 🐎</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

.question {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 20px;
}

.answers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.answer {
  background: white;
  border-radius: 15px;
  border: 3px solid transparent;
  padding: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.answer:hover {
  border-color: #c98b2c;
  background-color: #fff7e8;
}

.answer img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 10px;
}

.label {
  margin-top: 8px;
  font-weight: bold;
}

.nav {
  margin-top: 20px;
}

button {
  padding: 10px 20px;
  margin: 5px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: #c98b2c;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #a96f1f;
}

button:disabled {
  background: #ccc;
  cursor: not-allowed;
}

@media (max-width: 700px) {
  .answers {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Avventura con Spirit 🐎</h1>
  <h1>QUIZ SUL CAVALLO 🐴</h1>

  <div class="question" id="question"></div>
  <div class="answers" id="answers"></div>

  <div class="nav">
    <button id="prevBtn" onclick="prevQuestion()">⬅ Indietro</button>
    <button id="nextBtn" onclick="nextQuestion()">Avanti ➡</button>
  </div>
</div>

<script>
const quiz = [
  {
    q: "Cosa mangia il cavallo?",
    a: [
      { img: "erba.png", label: "ERBA + FIENO" },
      { img: "biscotti.png", label: "BISCOTTI" },
      { img: "carne.png", label: "CARNE" }
    ]
  },
  {
    q: "Il cavallo è...",
    a: [
      { img: "erbivoro.png", label: "ERBIVORO" },
      { img: "carne.png", label: "CARNIVORO" },
      { img: "onnivoro.png", label: "ONNIVORO" }
    ]
  },
  {
    q: "Il cavallo può provare emozioni?",
    a: [
      { img: "si.png", label: "SÌ" },
      { img: "no.png", label: "NO" }
    ]
  },
  {
    q: "Se non ti conosce può provare...",
    a: [
      { img: "paura.png", label: "PAURA" },
      { img: "fiducia.png", label: "FIDUCIA" },
      { img: "fame.png", label: "FAME" }
    ]
  },
  {
    q: "Come si muove il cavallo?",
    a: [
      { img: "passo.png", label: "PASSO" },
      { img: "trotto.png", label: "TROTTO" },
      { img: "galoppo.png", label: "GALOPPO" }
    ]
  },
  {
    q: "Come ci avviciniamo?",
    a: [
      { img: "avvicinarsi.png", label: "CALMA" },
      { img: "correre.png", label: "CORRERE" },
      { img: "dietro.png", label: "DIETRO" }
    ]
  },
  {
    q: "Le andature del cavallo sono:",
    a: [
      { img: "passo.png", label: "PASSO, TROTTO, GALOPPO" },
      { img: "medio.png", label: "MEDIO, TROTTO, LIBERO" },
      { img: "veloce.png", label: "GALOPPO, VELOCE, ALLUNGATO" }
    ]
  },
  {
    q: "Qual è l'andatura più veloce?",
    a: [
      { img: "passo.png", label: "PASSO" },
      { img: "trotto.png", label: "TROTTO" },
      { img: "galoppo.png", label: "GALOPPO" }
    ]
  },
  {
    q: "Dove vive meglio?",
    a: [
      { img: "box.jpg", label: "BOX" },
      { img: "paddock.jpg", label: "PADDOCK E PASCOLO" },
      { img: "scuderia.jpg", label: "SCUDERIA" }
    ]
  },
  {
    q: "Dove è pericoloso stare vicino al cavallo?",
    a: [
      { img: "dietro.png", label: "DIETRO" },
      { img: "davanti.png", label: "DAVANTI" },
      { img: "fianco.png", label: "FIANCO" }
    ]
  },
  {
    q: "Cosa fa stare bene il cavallo?",
    a: [
      { img: "fame.png", label: "FAME" },
      { img: "spazzola.png", label: "TOELETTATURA" },
      { img: "box.jpg", label: "STARE NEL BOX" }
    ]
  }
];

let current = 0;

function loadQuestion() {
  const questionDiv = document.getElementById("question");
  const answersDiv = document.getElementById("answers");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  questionDiv.innerText = quiz[current].q;
  answersDiv.innerHTML = "";

  quiz[current].a.forEach(answer => {
    const card = document.createElement("div");
    card.className = "answer";

    card.innerHTML = `
      <img src="${answer.img}" alt="${answer.label}">
      <div class="label">${answer.label}</div>
    `;

    card.onclick = nextQuestion;
    answersDiv.appendChild(card);
  });

  prevBtn.disabled = current === 0;
  nextBtn.innerText = current === quiz.length - 1 ? "Fine 🎉" : "Avanti ➡";
}

function nextQuestion() {
  if (current < quiz.length - 1) {
    current++;
    loadQuestion();
  } else {
    document.querySelector(".container").innerHTML = `
      <h1>Hai finito! 🎉</h1>
      <p class="question">Bravo, hai completato il quiz sul cavallo 🐴</p>
      <button onclick="location.reload()">Ricomincia</button>
    `;
  }
}

function prevQuestion() {
  if (current > 0) {
    current--;
    loadQuestion();
  }
}

loadQuestion();
</script>

</body>
</html>
