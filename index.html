<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Quiz Cavallo</title>

<style>
body {
  font-family: Arial;
  text-align: center;
}

.options {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.option-card {
  border: 2px solid #ccc;
  padding: 10px;
  cursor: pointer;
  width: 200px;
}

.option-card:hover {
  background-color: #f0f0f0;
}

img {
  width: 100%;
}
</style>

</head>

<body>

<h1>QUIZ SUL CAVALLO 🐴</h1>

<div id="quiz"></div>

<script>
const questions = [
{
  q: "Come si muove il cavallo?",
  options: [
    { text: "Passo", img: "passo.png" },
    { text: "Trotto", img: "trotto.png" },
    { text: "Galoppo", img: "galoppo.png" }
  ]
},
{
  q: "Cosa mangia il cavallo?",
  options: [
    { text: "Carne", img: "carne.png" },
    { text: "Erba", img: "erba.png" },
    { text: "Pesce", img: "pesce.png" }
  ]
},
{
  q: "Il cavallo è:",
  options: [
    { text: "Carnivoro", img: "carne.png" },
    { text: "Erbivoro", img: "erba.png" },
    { text: "Onnivoro", img: "pesce.png" }
  ]
}
];

let current = 0;

function showQuestion() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  const q = questions[current];

  const title = document.createElement("h2");
  title.textContent = (current + 1) + ". " + q.q;
  quiz.appendChild(title);

  const container = document.createElement("div");
  container.className = "options";

  const lettere = ["a)", "b)", "c)"];

  q.options.forEach((opt, index) => {
    const card = document.createElement("div");
    card.className = "option-card";

    card.innerHTML = `
      <strong>${lettere[index]}</strong><br>
      <img src="${opt.img}">
      <p>${opt.text}</p>
    `;

    card.onclick = () => nextQuestion();

    container.appendChild(card);
  });

  quiz.appendChild(container);
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    document.getElementById("quiz").innerHTML = "<h2>Hai finito! 🎉</h2>";
  }
}

showQuestion();
</script>

</body>
</html>
