<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avventura con Spirit 🐎</title>
<title>Quiz Cavallo</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f0e6;
  font-family: Arial;
  text-align: center;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 20px;
}

.question {
  font-size: 22px;
  margin-bottom: 20px;
}

.answers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
.options {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}

.answer {
  background: white;
  border-radius: 15px;
.option-card {
  border: 2px solid #ccc;
  padding: 10px;
  cursor: pointer;
  border: 3px solid transparent;
  transition: 0.3s;
  width: 200px;
}

.answer:hover {
  border: 3px solid #c98b2c;
.option-card:hover {
  background-color: #f0f0f0;
}

.answer img {
img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: 10px;
}

.label {
  margin-top: 8px;
  font-weight: bold;
}

.nav {
  margin-top: 20px;
}

button {
  padding: 10px 20px;
  margin: 5px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  background: #c98b2c;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="container">
<h1>Avventura con Spirit 🐎</h1>
<h1>QUIZ SUL CAVALLO 🐴</h1>

<div class="question" id="question"></div>
<div class="answers" id="answers"></div>

<div class="nav">
<button onclick="prevQuestion()">⬅ Indietro</button>
<button onclick="nextQuestion()">Avanti ➡</button>
</div>
</div>
<div id="quiz"></div>

<script>
const quiz = [

{
q: "Cosa mangia il cavallo?",
a: [
{img:"erba.png", label:"ERBA + FIENO"},
{img:"biscotti.png", label:"BISCOTTI"},
{img:"carne.png", label:"CARNE"}
]
},

{
q: "Il cavallo è...",
a: [
{img:"erbivoro.png", label:"ERBIVORO"},
{img:"carne.png", label:"CARNIVORO"},
{img:"onnivoro.png", label:"ONNIVORO"}
]
},

{
q: "Il cavallo può provare emozioni?",
a: [
{img:"si.png", label:"SI"},
{img:"no.png", label:"NO"}
]
},

const questions = [
{
q: "Se non ti conosce può provare...",
a: [
{img:"paura.png", label:"PAURA"},
{img:"fiducia.png", label:"FIDUCIA"},
{img:"fame.png", label:"FAME"}
]
  q: "Come si muove il cavallo?",
  options: [
    { text: "Passo", img: "passo.png" },
    { text: "Trotto", img: "trotto.png" },
    { text: "Galoppo", img: "galoppo.png" }
  ]
},

{
q: "Come ci avviciniamo?",
a: [
{img:"avvicinarsi.png", label:"CALMA"},
{img:"correre.png", label:"CORRERE"},
{img:"dietro.png", label:"DIETRO"}
]
  q: "Cosa mangia il cavallo?",
  options: [
    { text: "Carne", img: "carne.png" },
    { text: "Erba", img: "erba.png" },
    { text: "Pesce", img: "pesce.png" }
  ]
},

{
q: "Le andature del cavallo sono:",
a: [
{img:"passo.png", label:"PASSO, TROTTO, GALOPPO"},
{img:"medio.png", label:"MEDIO, TROTTO, LIBERO"},
{img:"veloce.png", label:"GALOPPO, VELOCE, ALLUNGATO"}
]
},

{
q: "Qual è l'andatura più veloce?",
a: [
{img:"passo.png", label:"PASSO"},
{img:"trotto.png", label:"TROTTO"},
{img:"galoppo.png", label:"GALOPPO"}
]
},

{
q: "Dove vive meglio?",
a: [
{img:"box.jpg", label:"BOX"},
{img:"paddock.jpg", label:"PADDOCK E PASCOLO"},
{img:"scuderia.jpg", label:"SCUDERIA"}
]
},

{
q: "Dove è pericoloso?",
a: [
{img:"dietro.png", label:"DIETRO"},
{img:"davanti.png", label:"DAVANTI"},
{img:"fianco.png", label:"FIANCO"}
]
},

{
q: "Cosa fa stare bene il cavallo?",
a: [
{img:"fame.png", label:"FAME"},
{img:"spazzola.png", label:"TOELETTATURA"},
{img:"box.jpg", label:"STARE NEL BOX"}
]
  q: "Il cavallo è:",
  options: [
    { text: "Carnivoro", img: "carne.png" },
    { text: "Erbivoro", img: "erba.png" },
    { text: "Onnivoro", img: "pesce.png" }
  ]
}

];

let current = 0;

function loadQuestion() {
  document.getElementById("question").innerText = quiz[current].q;
function showQuestion() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";

  const q = questions[current];

  const title = document.createElement("h2");
  title.textContent = (current + 1) + ". " + q.q;
  quiz.appendChild(title);

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";
  const container = document.createElement("div");
  container.className = "options";

  quiz[current].a.forEach(ans => {
    const div = document.createElement("div");
    div.className = "answer";
  const lettere = ["a)", "b)", "c)"];

    div.innerHTML = `
      <img src="${ans.img}" alt="${ans.label}">
      <div class="label">${ans.label}</div>
  q.options.forEach((opt, index) => {
    const card = document.createElement("div");
    card.className = "option-card";

    card.innerHTML = `
      <strong>${lettere[index]}</strong><br>
      <img src="${opt.img}">
      <p>${opt.text}</p>
    `;

    answersDiv.appendChild(div);
    card.onclick = () => nextQuestion();

    container.appendChild(card);
  });
}

function nextQuestion() {
  if (current < quiz.length - 1) {
    current++;
    loadQuestion();
  }
  quiz.appendChild(container);
}

function prevQuestion() {
  if (current > 0) {
    current--;
    loadQuestion();
function nextQuestion() {
  current++;
  if (current < questions.length) {
    showQuestion();
  } else {
    document.getElementById("quiz").innerHTML = "<h2>Hai finito! 🎉</h2>";
  }
}

loadQuestion();
showQuestion();
</script>

</body>
</html>
