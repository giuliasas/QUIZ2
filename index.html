<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Spirit</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #fff7ec;
}

.option-card {
    border: 2px solid #ccc;
    border-radius: 10px;
    padding: 10px;
    margin: 10px;
    display: inline-block;
    cursor: pointer;
    width: 200px;
}

.option-card:hover {
    background: #ffe0b2;
}

img {
    width: 100%;
}
</style>
</head>

<body>

<h1>Avventura con Spirit 🐴</h1>

<div id="question"></div>
<div id="options"></div>

<br>
<button onclick="next()">Avanti</button>

<script>

const questions = [
{
    q: "COSA MANGIA IL CAVALLO?",
    options: [
        {text:"ERBA", img:"https://via.placeholder.com/150?text=Erba"},
        {text:"PIZZA", img:"https://via.placeholder.com/150?text=Pizza"},
        {text:"GELATO", img:"https://via.placeholder.com/150?text=Gelato"}
    ],
    correct: 0
},
{
    q: "DOVE VIVE IL CAVALLO?",
    options: [
        {text:"STALLA", img:"https://via.placeholder.com/150?text=Stalla"},
        {text:"MARE", img:"https://via.placeholder.com/150?text=Mare"},
        {text:"LUNA", img:"https://via.placeholder.com/150?text=Luna"}
    ],
    correct: 0
}
];

let current = 0;

function render() {
    const q = questions[current];

    // 👉 NUMERO DOMANDA
    document.getElementById("question").innerText =
        (current + 1) + ". " + q.q;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.options.forEach((opt, i) => {

        // 👉 a b c
        const letters = ["a)", "b)", "c)"];

        const div = document.createElement("div");
        div.className = "option-card";

        div.innerHTML = `
            <img src="${opt.img}">
            <p><b>${letters[i]}</b> ${opt.text}</p>
        `;

        div.onclick = () => checkAnswer(i);

        optionsDiv.appendChild(div);
    });
}

function checkAnswer(i) {
    if (i === questions[current].correct) {
        alert("Corretto!");
    } else {
        alert("Sbagliato!");
    }
}

function next() {
    current++;
    if (current >= questions.length) {
        alert("Hai finito il quiz!");
        current = 0;
    }
    render();
}

render();

</script>

</body>
</html>
