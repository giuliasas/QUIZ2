
<script>
let currentQuestionIndex = 0;

function renderQuestion() {
    const q = questions[currentQuestionIndex];

    // NUMERO DOMANDA
    document.getElementById("question-text").innerText =
        (currentQuestionIndex + 1) + ". " + q.q;

    const optionsContainer = document.getElementById("options-buttons");
    optionsContainer.innerHTML = "";

    q.options.forEach((opt, index) => {

        // LETTERE a, b, c
        const letter = ["a)", "b)", "c)"][index];

        const card = document.createElement("div");
        card.className = "option-card";

        const label = document.createElement("div");
        label.className = "image-label";
        label.innerText = letter + " " + opt.items[0].text;

        const img = document.createElement("img");
        img.src = opt.items[0].img;

        const wrapper = document.createElement("div");
        wrapper.className = "image-unit";
        wrapper.appendChild(img);
        wrapper.appendChild(label);

        card.appendChild(wrapper);

        card.onclick = () => selectOption(index);

        optionsContainer.appendChild(card);
    });

    updateProgress();
}
</script>
